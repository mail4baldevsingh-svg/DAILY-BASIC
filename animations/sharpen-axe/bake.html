<!doctype html>
<html><head><meta charset="utf-8"><title>bake plates</title>
<style>html,body{margin:0;background:#000}</style>
<script src="vendor/p5.min.js"></script>
<script src="vendor/p5.brush.js"></script>
<script src="js/lib.js"></script>
<script src="js/bake.js"></script>
</head><body>
<script>
let JOB = null;
function setup() {
  createCanvas(W, H, WEBGL);
  pixelDensity(1);
  setAttributes('preserveDrawingBuffer', true);
  angleMode(DEGREES);
  brush.scaleBrushes(4.5);
  noLoop();
  window.READY = true;
}
function draw() {
  if (!JOB) return;
  randomSeed(JOB.seed); noiseSeed(JOB.seed);
  push(); translate(-W / 2, -H / 2);
  PLATES[JOB.name]();
  pop();
}
window.PLATE_NAMES = PLATE_NAMES;
window.bakePlate = async (name, seed = 1) => {
  JOB = { name, seed };
  await redraw();
  return document.querySelector('canvas').toDataURL('image/png');
};
</script>
</body></html>
